name: specs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first: this suite takes seconds,
# and a queue of superseded runs tells nobody anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  specs:
    name: rspec (ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # .ruby-version is the one that matters; the others are here to catch a
        # syntax or stdlib assumption that only holds on the newest release.
        ruby: ["3.4", "4.0"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run the specs
        run: bundle exec rspec --format progress

      - name: Upload the coverage report
        if: always() && matrix.ruby == '4.0'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

  lint:
    name: standardrb
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      # `.standard.yml` sets `fix: false`, so this reports and never rewrites
      # the tree. A lint job that edits its own checkout is a lint job whose
      # result depends on whether anyone looked.
      - name: Lint
        run: bundle exec standardrb

  setup:
    name: bin/setup is idempotent
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The interesting property is not that setup works once, but that running
      # it twice changes nothing the second time — it is a reconciler, and the
      # bug it exists to prevent is drift going unnoticed.
      - name: Link into a scratch CLAUDE_DIR
        env:
          CLAUDE_DIR: ${{ runner.temp }}/dot-claude
        run: |
          set -euo pipefail
          ./bin/setup --quiet
          first="$(./bin/setup --dry-run 2>&1)"
          ./bin/setup --quiet
          second="$(./bin/setup --dry-run 2>&1)"

          if [[ "$first" != "$second" ]]; then
            echo "bin/setup is not idempotent — a second run proposed different work:" >&2
            diff <(printf '%s\n' "$first") <(printf '%s\n' "$second") || true
            exit 1
          fi

          if printf '%s\n' "$second" | grep -qE '^\s+✓'; then
            echo "bin/setup still had work to do after already running:" >&2
            printf '%s\n' "$second" >&2
            exit 1
          fi

          echo "bin/setup reached a fixed point."
