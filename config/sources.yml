# External skill and plugin sources, pulled by `scripts/install-sources`.
#
# Add a repo here instead of installing it by hand: `scripts/install-sources`
# clones it into `.sources/<name>` (gitignored, kept for `git pull` reuse and
# for recording exactly which commit is installed) and installs its content
# into `skills/` or `plugins/` — both also gitignored, both fully regenerable
# from this file plus `src/skills/`. `-f` wipes `.sources` and re-clones
# everything fresh, which is the whole answer to "these skills went stale and
# I can't even tell where they came from."
#
#   type: skills — every subdirectory under `path` (repo root if omitted)
#                  becomes its own skills/<dir-name>
#   type: plugin — `path` becomes plugins/<name>, one bundle. If that bundle
#                  has its own skills/ subdirectory, each child is *also*
#                  symlinked individually into skills/<dir-name> — a plugin's
#                  skills are still just skills.
#   type: command — no repository at all. Runs `install:` with its working
#                  directory inside `.sources/<name>`, then installs the
#                  skills and plugin bundles that turned up there.
#
# A command source, in full:
#
#   - name: quota-axi
#     type: command
#     install: npx skills add kunchenguid/quota-axi --skill quota-axi --yes
#     adopt: [skills, plugins]   # the default; name one to take only that half
#
# The command line is split into words and run directly, never handed to a
# shell, so it does what it looks like it does and a stray quote or `$HOME`
# means nothing. Pipes and redirects are therefore out; if you need them, put
# them in a script and call the script.
#
# Do not pass a global flag. `npx skills add … -g` writes into
# ~/.claude/skills, outside this repo, where nothing records where it came
# from, no filter narrows it, and tightening one never takes it back. Dropping
# `-g` makes the same command write `.claude/skills/<name>` inside
# `.sources/<name>`, which is an ordinary source tree that everything below
# applies to. That is the whole trick.
#
# It runs once. `npx` re-downloads on every invocation and this script gets
# run several times a day, so a command whose output is already in `.sources`
# is left alone. `-f` wipes `.sources`, which is how you run it again.
#
# Narrowing a source that carries more than you want:
#
#   include_skills:  /re/   install only the skills whose name matches
#   exclude_skills:  /re/   install every skill except those whose name matches
#   include_plugins: /re/   the same two, for plugin bundles, on a
#   exclude_plugins: /re/   `type: plugin` or `type: command` source
#
# One or the other per kind, never both on the same source; a source that both
# allows and denies is a question with no defensible answer, so the run stops.
# All four are matched against the name the thing installs as — the
# `skills/<name>` or `plugins/<name>` you go looking for — and not against its
# path inside the source, because a category tree is that repo's filing
# decision rather than yours. The slashes are optional and only there so the
# value reads as a regular expression; `/re/i` and the `m`/`x` flags work too.
# Anchor with `\A`/`\z` when you mean a whole name, since a bare `tdd` matches
# `tdd-helper` as well.
#
# Tightening a filter also takes skills back: the next run unlinks whatever it
# installed last time and no longer installs, so `skills/` converges on what
# this file says rather than accumulating.
#
# `include_skills`/`exclude_skills` govern the fan-out into `skills/`, and
# `include_plugins`/`exclude_plugins` govern which bundles get copied. Neither
# reaches inside a bundle: it stays whole because it is one unit with its own
# manifest, and half a plugin is not a smaller plugin. On a one-bundle
# `type: plugin` source, `exclude_plugins` and `adopt: skills` say the same
# thing, which is take its skills and leave the bundle.
sources:
  - name: mattpocock
    type: skills
    repo: git@github.com:mattpocock/skills.git
    path: skills
    exclude_skills: /\A(wizard|grilling)\z/

  - name: pstack
    type: plugin
    repo: git@github.com:cursor/plugins.git
    path: pstack
    include_skills: /\A(architect|unslop|why|how|technical-writing)\z/

  - name: superpowers
    type: plugin
    repo: git@github.com:obra/superpowers.git

  - name: quota-axi
    type: command
    install: npx skills add kunchenguid/quota-axi --skill quota-axi --yes


