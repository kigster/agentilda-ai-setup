# yaml-language-server: $schema=./configuration.schema.json
# What this machine should have: which coding agents, and which skills and
# plugins to give them. Copy to configuration.yml, which is git-ignored and
# is the file `scripts/install-sources` actually reads. A first run does the
# copy for you, then stops so you can read it before it installs anything.
#
# Add a repo here instead of installing it by hand: `scripts/install-sources`
# clones it into `.sources/<name>` (gitignored, kept for `git pull` reuse and
# for recording exactly which commit is installed) and installs its content
# into `skills/` or `plugins/` — both also gitignored, both fully regenerable
# from this file plus `src/skills/`. `-f` wipes `.sources` and re-clones
# everything fresh, which is the whole answer to "these skills went stale and
# I can't even tell where they came from."
#
#   type: skills — every subdirectory under `path` (repo root if omitted)
#                  becomes its own skills/<dir-name>
#   type: plugin — `path` becomes plugins/<name>, one bundle. If that bundle
#                  has its own skills/ subdirectory, each child is *also*
#                  symlinked individually into skills/<dir-name> — a plugin's
#                  skills are still just skills.
#   type: plugins — `path` is a directory *of* bundles: every subdirectory
#                  under it becomes its own plugins/<dir-name>, on the same
#                  terms. This is the shape a marketplace repository has, and
#                  it is how you take three of its bundles with one entry and
#                  one clone. Narrow it with include_plugins/exclude_plugins;
#                  `adopt:` is not the key for that, since it says which
#                  halves a source hands over rather than which bundles.
#   type: command — no repository at all. Runs `install:` with its working
#                  directory inside `.sources/<name>`, then installs the
#                  skills and plugin bundles that turned up there.
#
# A command source, in full:
#
#   - name: quota-axi
#     type: command
#     install: npx skills add kunchenguid/quota-axi --skill quota-axi --yes
#     adopt: [skills, plugins]   # the default; name one to take only that half
#
# The command line is split into words and run directly, never handed to a
# shell, so it does what it looks like it does and a stray quote or `$HOME`
# means nothing. Pipes and redirects are therefore out; if you need them, put
# them in a script and call the script.
#
# Do not pass a global flag. `npx skills add … -g` writes into
# ~/.claude/skills, outside this repo, where nothing records where it came
# from, no filter narrows it, and tightening one never takes it back. Dropping
# `-g` makes the same command write `.claude/skills/<name>` inside
# `.sources/<name>`, which is an ordinary source tree that everything below
# applies to. That is the whole trick.
#
# It runs once. `npx` re-downloads on every invocation and this script gets
# run several times a day, so a command whose output is already in `.sources`
# is left alone. `-f` wipes `.sources`, which is how you run it again.
#
# Narrowing a source that carries more than you want:
#
#   include_skills:  /re/   install only the skills whose name matches
#   exclude_skills:  /re/   install every skill except those whose name matches
#   include_plugins: /re/   the same two, for plugin bundles, on a
#   exclude_plugins: /re/   `type: plugin`, `plugins` or `command` source
#
# A source may set both of a pair, and then the order it writes them in is the
# whole meaning: the rules apply top to bottom and the last one to match a
# name decides. So
#
#   include_plugins: /.*/
#   exclude_plugins: /\Aruby-lsp\z/
#
# takes every bundle but ruby-lsp, and the same two lines the other way round
# take ruby-lsp and nothing else. What no rule matches falls back to the
# opposite of the first: a source that opens by including keeps only what it
# asked for, one that opens by excluding keeps everything else, which is what
# a single rule on its own has always meant.
#
# All four are matched against the name the thing installs as — the
# `skills/<name>` or `plugins/<name>` you go looking for — and not against its
# path inside the source, because a category tree is that repo's filing
# decision rather than yours. The slashes are optional and only there so the
# value reads as a regular expression; `/re/i` and the `m`/`x` flags work too.
# Anchor with `\A`/`\z` when you mean a whole name, since a bare `tdd` matches
# `tdd-helper` as well.
#
# Tightening a filter also takes skills back: the next run unlinks whatever it
# installed last time and no longer installs, so `skills/` converges on what
# this file says rather than accumulating.
#
# Saying which agents a source is for:
#
#   agents:         [claude]   only for these
#   exclude_agents: [claude]   for every agent named above except these
#
# One or the other, like the pairs above, and for the same reason. Leaving
# both out means portable, which is what most sources are and what this repo
# is for; the vendor-locked one is the exception, so it is the one that says
# so. A name here is matched against the `agents:` block at the top, and a
# source no agent there would read is skipped, and said so, rather than
# installing skills that nothing on this machine can load. It prunes when
# skipped, the same as a tightened filter, since being for nobody here is a
# decision rather than a failure.
#
# `include_skills`/`exclude_skills` govern the fan-out into `skills/`, and
# `include_plugins`/`exclude_plugins` govern which bundles get copied. Neither
# reaches inside a bundle: it stays whole because it is one unit with its own
# manifest, and half a plugin is not a smaller plugin. On a one-bundle
# `type: plugin` source, `exclude_plugins` and `adopt: skills` say the same
# thing, which is take its skills and leave the bundle.
# The coding agents themselves. Each `installer:` is a vendor's own line,
# verbatim from their install page, so unlike a source's `install:` it does
# go through a shell — that is what a `curl … | sh` is. The difference is
# deliberate: a source's command runs on every sync, for anyone who clones
# this repo, while an agent installer runs only when somebody asks for it by
# name, and never as part of a routine sync.
#
# An agent already on PATH is left alone.
#
#   scripts/install-sources agents            # what is configured, and what is installed
#   scripts/install-sources agents install    # install the ones that are missing
#
# This list is also what `agents:` on a source below is matched against: a
# source for an agent that is neither installed nor listed here is skipped,
# and said so, rather than installing skills nothing will ever read.
agents:
  - name: claude
    installer: curl -fsSL https://claude.ai/install.sh | bash
  - name: pi
    installer: curl -fsSL https://pi.dev/install.sh | sh
  - name: grok
    installer: curl -fsSL https://x.ai/cli/install.sh | bash
  - name: codex
    installer: curl -fsSL https://chatgpt.com/codex/install.sh | sh
  - name: kiro
    installer: curl -fsSL https://cli.kiro.dev/install | bash
  - name: opencode
    installer: curl -fsSL https://opencode.ai/install | bash
  - name: cursor
    installer: curl https://cursor.com/install -fsS | bash

sources:
  - name: mattpocock
    type: skills
    repo: git@github.com:mattpocock/skills.git
    path: skills
    exclude_skills: /\A(wizard|grilling)\z/

  - name: pstack
    type: plugin
    repo: git@github.com:cursor/plugins.git
    path: pstack
    include_skills: /\A(architect|unslop|why|how|technical-writing)\z/

  - name: superpowers
    type: plugin
    repo: git@github.com:obra/superpowers.git

  - name: quota-axi
    type: command
    install: npx skills add kunchenguid/quota-axi --skill quota-axi --yes

  # Braintrust ships its skill through its own CLI rather than a repository.
  # `bt setup skills` is the narrow subcommand: bare `bt setup` is a wizard that
  # also instruments the repo and runs a coding agent, which is not a thing to
  # do on a sync. --no-input keeps it from prompting, --no-workflow skips a docs
  # download, and --local writes into the working tree rather than ~/.claude.
  #
  # It writes .agents/skills/, not .claude/skills/, even when told
  # --agent claude. Both roots are searched, so either lands.
  - name: braintrust
    type: command
    install: bt setup skills --local --agent claude --no-input --no-workflow
    adopt: [skills]

  # nginx-configuration carries a .skillfish.json naming the repo, path and
  # commit it came from, and security-baseline has an entry in .skill-lock.json.
  # Neither was written here, so neither belongs in src/skills.
  #
  # Filtered to the one skill each that was actually in use. Widen or drop the
  # filter to take more: karchtho's infra bundle has seven, rampstackco has 103.

  - name: karchtho-infra
    type: skills
    repo: https://github.com/karchtho/my-claude-marketplace.git
    path: bundles/infra-bundle/skills
    include_skills: /\Anginx-configuration\z/

  - name: rampstack
    type: skills
    repo: https://github.com/rampstackco/claude-skills.git
    path: skills
    # The four design skills rey-frontend loads, plus security-baseline.
    # theme-factory from anthropics/skills is deliberately absent: it themes
    # slides, docs and landing-page artifacts, which is not what building an
    # application's interface is.
    include_skills: /\A(security-baseline|design|brand|cost|email|art-direction|frontend-component-build|accessibility-audit|seo)\z/

  # Web Interface Guidelines, in forty lines. Small, and the only one of these
  # aimed at reviewing UI code rather than producing it.
  - name: vercel-guidelines
    type: skills
    repo: https://github.com/vercel-labs/agent-skills.git
    path: skills
    include_skills: /\Aweb-design-guidelines|deploy|react|vercel\z/

  # 72 skills, one per test framework or API concern, so this is all filter.
  #
  # `api-skill/` is a directory rather than a skill: it fans out into 24 of
  # them. The six taken here are the tool-agnostic ones. The Postman and Newman
  # families are twelve more, and they are left out because they are worth
  # having only if you use those tools; add them by name when that changes.
  #
  # Names carry the `-skill` suffix at the top level and do not inside
  # `api-skill/`, which is why the filter cannot just be a prefix.
  - name: lambdatest
    type: skills
    repo: https://github.com/LambdaTest/agent-skills.git
    include_skills: /\A(cypress-skill|vitest|smartui|rspec|jasmine|api|playwright-skill|cicd-pipeline-skill|openapi-spec-generator)\z/

  # ---- from the Claude plugin list this repo used to keep as shell commands --
  #
  # Each of these was a `claude plugin install` line in a markdown file. What
  # follows was checked against the actual repository trees, which corrected
  # four things the list got wrong: `ruby-lsp` is in a different marketplace
  # than it claimed and ships no skills at all, `rspec` was listed twice,
  # `github.com/anthropics/claude-code-plugins` does not exist, and
  # `npx claude-plugins` is third-party software resolving through a
  # third-party registry into ~/.claude, which is the one thing this file is
  # for avoiding.

  # Three SKILL.md directories, plain markdown. The bundle around them has a
  # Claude SessionStart hook; taking the skills alone leaves it behind, which
  # is why this is type: skills rather than type: plugin.
  - name: ruby-skills
    type: skills
    repo: https://github.com/st0012/ruby-skills.git
    path: plugins/ruby-skills/skills

  # One clone for both, since they are two plugins in one marketplace. The
  # filter is what leaves dragonruby, draper, mcp and ratatui behind.
  - name: ruby-marketplace
    type: skills
    repo: https://github.com/hoblin/claude-ruby-marketplace.git
    path: plugins
    include_skills: /\A(rspec|activerecord)\z/

  - name: justfile
    type: skills
    repo: https://github.com/motlin/claude-code-plugins.git
    path: plugins/justfile/skills

  - name: frontend-design
    type: skills
    repo: https://github.com/anthropics/claude-plugins-official.git
    path: plugins/frontend-design/skills

  # devops-claude-skills files every skill as `<plugin>/skills/SKILL.md` with
  # no directory of its own, so all six want to be called `skills`. Taking the
  # bundle whole sidesteps a name none of them can have. Ask for the skills
  # instead and the run tells you exactly that, at length.
  - name: iac-terraform
    type: plugin
    repo: https://github.com/ahmedasmar/devops-claude-skills.git
    path: iac-terraform
    adopt: [plugins]
    agents: [claude]

  - name: ci-cd
    type: plugin
    repo: https://github.com/ahmedasmar/devops-claude-skills.git
    path: ci-cd
    adopt: [plugins]
    agents: [claude]

  # Two Claude-only bundles out of one marketplace, and so one entry and one
  # clone: `type: plugins` installs every directory under `path` as a bundle
  # of its own, and the filter picks the two. Which bundles to take is what
  # `include_plugins` is for; `adopt:` says which *halves* a source hands over
  # and never which bundles. Neither of these two has a SKILL.md anywhere in
  # it — pr-review-toolkit is six subagent definitions and a slash command,
  # security-guidance is eleven Python files wired into SessionStart,
  # UserPromptSubmit and PostToolUse through ${CLAUDE_PLUGIN_ROOT} — so both
  # are Claude-only, and not arguably.
  - name: claude-official
    type: plugins
    repo: https://github.com/anthropics/claude-plugins-official.git
    path: plugins
    exclude_plugins: /\A(clang|csharp|cwc|explanatory|gopls|jdtls|kotlin|lua|php)\z/
    adopt: [plugins]
    agents: [claude]

  # Deliberately absent: ruby-lsp. It is `ruby-lsp@claude-ruby-marketplace`,
  # not `@ruby-skills`, and it is three files — a plugin manifest, a README and
  # a 20-line .lsp.json pointing at Shopify's ruby-lsp binary. There is no
  # portable content to install. Install the gem and configure the LSP per
  # agent instead.
