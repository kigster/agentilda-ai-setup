# `fix` stays false so that `just lint` only reports. `just format` passes
# --fix explicitly, which keeps "check the code" and "change the code" as two
# different verbs — a lint step that edits the tree is a nasty surprise in CI.
fix: false              # default: false
parallel: true          # default: false
format: progress        # default: Standard::Formatter
ruby_version: 4.0       # default: RUBY_VERSION
default_ignores: false  # default: true

# Anchored with `**/` rather than at the root, because the directories these
# name are no longer only at the root. Lint runs from here so that it sees
# scripts/ and workflow/ alike, but the bundle installs into
# workflow/vendor/bundle and the suite writes workflow/coverage, and
# `vendor/**/*` matches neither. CI is where that shows: a developer with
# gems in rbenv has no vendor/ at all, so it passes locally and then lints
# sixty-odd installed gems on the runner.
ignore:                 # default: []
  - '**/vendor/**/*'
  - '**/coverage/**/*'
  - '**/tmp/**/*'
  - 'plugins/**/*'
  - 'plugins-disabled/**/*'
  - 'skills/**/*'



# No plugins: `standard-rails` is not installed and this is not a Rails
# project, and `extend_config` pointed at a .standard_ext.yml that has never
# existed. Both came from the Gemfile's generator and stopped standardrb from
# starting at all.
